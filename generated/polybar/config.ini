; Generated by theme/build.lua
; Do not edit this file directly.
; Edit the source template or theme file instead.

[colors]
background = #0B111C
background-alt = #D7193F
foreground = #D8E3F0
primary = #D7193F
secondary = #5F7FA8
alert = #A84B65
disabled = #61748D

[bar/main]
width = 99.3%
height = 25
offset-x = 5
offset-y = 5
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

radius = 0
line-size = 3

padding-left = 2
padding-right = 2

module-margin-left = 2
module-margin-right = 2

separator = |
separator-foreground = ${colors.disabled}

font-0 = "Inconsolata Nerd Font Mono:size=10;2"
font-1 = "Inconsolata Nerd Font Mono:size=10:weight=bold;2"

modules-left = i3 
modules-center = datetime
modules-right = pulseaudio memory cpu temperature

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = true
wm-restack = i3

[module/i3]
type = internal/i3
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = true

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.alert}

label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.primary}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/pulseaudio]
type = internal/pulseaudio

format-volume = VOL <label-volume>
format-volume-foreground = ${colors.primary}

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

[module/datetime]
type = internal/date
interval = 1.0

date = %A, %B %d %Y
time = %H:%M

format = <label>
label = " %date%  %time% "
label-background = ${colors.primary}
label-foreground = ${colors.background}
label-padding-left = 2
label-padding-right = 2
label-alignment = center

[module/memory]
type = internal/memory
interval = 2

format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/temperature]
type = internal/temperature
interval = 2
warn-temperature = 80

format = <label>
format-warn = <label-warn>

label = TEMP %temperature-c%
label-foreground = ${colors.foreground}

label-warn = TEMP %temperature-c%
label-warn-foreground = ${colors.alert}

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = 5
margin-bottom = 5
