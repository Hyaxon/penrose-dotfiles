[colors]
background = {{colors.bg}}
background-alt = {{colors.accent}}
foreground = {{colors.fg}}
primary = {{colors.accent}}
secondary = {{colors.secondary}}
alert = {{colors.alert}}
disabled = {{colors.disabled}}

[bar/main]
width = {{polybar.width}}
height = {{polybar.height}}
offset-x = {{polybar.offset_x}}
offset-y = {{polybar.offset_y}}
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

radius = {{polybar.radius}}
line-size = 3

padding-left = 2
padding-right = 2

module-margin-left = 2
module-margin-right = 2

separator = |
separator-foreground = ${colors.disabled}

font-0 = "{{fonts.ui}}:size={{fonts.bar_size}};2"
font-1 = "{{fonts.ui}}:size={{fonts.bar_size}}:weight=bold;2"

modules-left = i3 
modules-center = datetime
modules-right = pulseaudio memory cpu battery temperature

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = true
wm-restack = i3

[module/i3]
type = internal/i3
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = true

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.alert}

label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.primary}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/pulseaudio]
type = internal/pulseaudio

format-volume = VOL <label-volume>
format-volume-foreground = ${colors.primary}

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

[module/datetime]
type = internal/date
interval = 1.0

date = %A, %B %d %Y
time = %I:%M %p

format = <label>
label = " %date%  %time% "
label-background = ${colors.primary}
label-foreground = ${colors.background}
label-padding-left = 2
label-padding-right = 2
label-alignment = center

[module/memory]
type = internal/memory
interval = 2

format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC
full-at = 98

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>

label-charging = " %percentage%% "
label-discharging = " %percentage%% "
label-full = " Full "

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

label-charging-background = ${colors.primary}
label-charging-foreground = ${colors.background}
label-discharging-background = ${colors.primary}
label-discharging-foreground = ${colors.background}
label-full-background = ${colors.primary}
label-full-foreground = ${colors.background}

[module/temperature]
type = internal/temperature
interval = 2
warn-temperature = 80

format = <label>
format-warn = <label-warn>

label = TEMP %temperature-c%
label-foreground = ${colors.foreground}

label-warn = TEMP %temperature-c%
label-warn-foreground = ${colors.alert}

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-top = {{polybar.offset_y}}
margin-bottom = 5
